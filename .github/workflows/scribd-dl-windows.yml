name: Instalador Windows (Scribd a PDF)

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/scribd-dl/**'
      - '.github/workflows/scribd-dl-windows.yml'
    tags:
      - 'scribd-dl-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: tools/scribd-dl
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/scribd-dl/package-lock.json

      - run: npm ci

      - run: npm test

      - name: Compilar instalador
        run: npm run dist:win

      - uses: actions/upload-artifact@v4
        with:
          name: Scribd-a-PDF-Setup
          path: tools/scribd-dl/dist/*.exe
          if-no-files-found: error

      - name: Publicar release (solo con tag scribd-dl-v*)
        if: startsWith(github.ref, 'refs/tags/scribd-dl-v')
        uses: softprops/action-gh-release@v2
        with:
          files: tools/scribd-dl/dist/*.exe
