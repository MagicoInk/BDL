<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
  <title>Scribd a PDF</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <h1>Scribd a PDF</h1>
      <p>Pega uno o varios enlaces de documentos de Scribd, uno por línea.</p>
    </header>

    <label for="urls">Enlaces</label>
    <textarea id="urls" rows="5" spellcheck="false"
      placeholder="https://es.scribd.com/document/463859555/25-Carpeta-Minima-Odun-de-Ifa"></textarea>

    <label for="folder">Guardar en</label>
    <div class="row">
      <input id="folder" readonly>
      <button id="choose" class="secondary">Cambiar…</button>
      <button id="open" class="secondary">Abrir</button>
    </div>

    <div class="row actions">
      <button id="go">Descargar</button>
      <button id="cancel" class="secondary" hidden>Cancelar</button>
      <span id="summary"></span>
    </div>

    <ul id="jobs"></ul>

    <footer>Solo guarda las páginas que Scribd muestra públicamente. Úsalo con documentos que tengas derecho a guardar.</footer>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
